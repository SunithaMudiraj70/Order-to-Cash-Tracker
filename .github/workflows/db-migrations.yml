name: Database Migrations Check

on:
  pull_request:
    paths:
      - 'backend/db/**'
      - 'backend/pipeline/src/pipeline/db/**'
  push:
    branches: [main]
    paths:
      - 'backend/db/**'

jobs:
  validate-migrations:
    name: Run Python DB Migrator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Migrator Dependencies
        run: |
          pip install psycopg2-binary typer python-dotenv

      - name: Dry Run Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m pipeline.db.migrate --help
