name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            apps/api/package.json
            apps/web/package.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Lint API
        run: |
          cd apps/api
          npm ci
          npm run lint

      - name: Lint Web
        run: |
          cd apps/web
          npm ci
          npm run lint

      - name: Lint Python Services
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy
          ruff check services/
          black --check services/
          mypy services/datagen/src services/detector/src

  test-apps:
    name: Unit Tests (API & Web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run API Unit Tests
        run: |
          cd apps/api
          npm ci
          npm test

      - name: Run Web Unit Tests
        run: |
          cd apps/web
          npm ci
          npm test

  test-python:
    name: Unit Tests (Datagen & Detector)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and Test Services
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          cd services/datagen && pip install -e .
          pytest
          cd ../detector && pip install -e .
          pytest

  database-migrations-and-pgtap:
    name: Supabase Local & pgTAP Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase Local Stack
        run: |
          supabase start

      - name: Verify Migrations Applied Cleanly
        run: |
          supabase db reset

      - name: Run pgTAP Schema & Constraint Tests
        run: |
          supabase test db

