name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/api/package.json
            frontend/package.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Lint Backend API
        run: |
          cd backend/api
          npm ci
          npm run lint

      - name: Lint Frontend
        run: |
          cd frontend
          npm ci
          npm run lint

      - name: Lint Python Pipeline
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy
          ruff check backend/pipeline/
          black --check backend/pipeline/
          mypy backend/pipeline/src

  test-apps:
    name: Unit Tests (API & Frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run API Unit Tests
        run: |
          cd backend/api
          npm ci
          npm test

      - name: Run Frontend Tests & Build
        run: |
          cd frontend
          npm ci
          npm test
          npm run build

  test-pipeline:
    name: Pipeline Tests & Data Reproduction
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and Test Pipeline
        run: |
          python -m pip install --upgrade pip
          cd backend/pipeline && pip install -e ".[dev]"
          pytest
          python -m pipeline.datagen generate --scale small
          python -m pipeline.datagen validate
          python -m pipeline.datagen reproduce
