name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/api/package.json
            frontend/package.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Lint and Typecheck Backend API
        run: |
          cd backend/api
          npm ci
          npm run lint
          npx tsc --noEmit

      - name: Lint and Typecheck Frontend
        run: |
          cd frontend
          npm ci
          npm run lint
          npx tsc --noEmit

      - name: Lint and Typecheck Python Pipeline
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pydantic pydantic-settings faker typer numpy psycopg2-binary
          ruff check backend/pipeline/
          ruff format --check backend/pipeline/
          mypy backend/pipeline/src

  db-migrations:
    name: Database Migrations & Assertions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase Local
        run: supabase start

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply Migrations & Run Schema Assertions
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          PYTHONPATH: backend/pipeline/src
        run: |
          python -m pip install psycopg2-binary pytest
          python -m pipeline.db.migrate
          pytest backend/pipeline/tests/test_db_assertions.py

  unit-tests:
    name: Unit Tests (API, Frontend, Pipeline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run API Unit Tests
        run: |
          cd backend/api
          npm ci
          npm test

      - name: Run Frontend Tests & Build
        run: |
          cd frontend
          npm ci
          npm test
          npm run build

      - name: Run Python Pipeline Tests & Reproducibility Check
        env:
          PYTHONPATH: backend/pipeline/src
        run: |
          python -m pip install --upgrade pip
          cd backend/pipeline && pip install -e ".[dev]"
          pytest
          python -m pipeline.datagen reproduce

  detection-benchmark:
    name: End-to-End Anomaly Detection Benchmark
    runs-on: ubuntu-latest
    needs: [db-migrations]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase Local
        run: supabase start

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate, Load, and Evaluate Anomaly Detection
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          PYTHONPATH: backend/pipeline/src
        run: |
          python -m pip install -e backend/pipeline
          python -m pipeline.db.migrate --reset --yes
          python -m pipeline.datagen generate --scale small
          python -m pipeline.loader load --scale small
          python -m pipeline.detector evaluate
          python -c "
          import json
          with open('data/manifests/detector_eval.json') as f:
              metrics = json.load(f)
          for m in metrics:
              assert m['f1_score'] >= 0.85, f\"{m['issue_type']} F1 score {m['f1_score']} < 0.85\"
          print('All 10 anomaly detector rules passed with F1 >= 0.85')
          "
