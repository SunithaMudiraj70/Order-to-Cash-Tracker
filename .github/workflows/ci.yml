name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/postgres
  SUPABASE_URL: http://127.0.0.1:54321
  SUPABASE_ANON_KEY: ci-placeholder-anon-key-test-matrix
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key-test-matrix
  JWT_SECRET: ci-secret-must-be-at-least-32-chars-long-strictly
  DEMO_USER_PASSWORD: DemoUserPassword2026!
  PYTHONPATH: backend/pipeline/src

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/api/package.json
            frontend/package.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Lint and Typecheck Backend API
        run: |
          cd backend/api
          npm ci
          npm run lint
          npm run typecheck

      - name: Lint and Typecheck Frontend
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run typecheck

      - name: Lint and Typecheck Python Pipeline
        run: |
          python -m pip install --upgrade pip
          cd backend/pipeline && pip install -e ".[dev]"
          ruff check .
          ruff format --check .
          mypy src

  db-migrations:
    name: Database Migrations & Assertions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Apply Supabase CI Stub & Migrations
        run: |
          sudo apt-get install -y postgresql-client
          psql postgresql://postgres:postgrespassword@localhost:5432/postgres -f backend/db/ci/00_supabase_stub.sql
          python -m pip install -e "backend/pipeline[dev]"
          python -m pipeline.db.migrate
          pytest backend/pipeline/tests/test_db_assertions.py

  unit-tests:
    name: Unit Tests (API, Frontend, Pipeline)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Database for Integration Tests
        run: |
          sudo apt-get install -y postgresql-client
          psql postgresql://postgres:postgrespassword@localhost:5432/postgres -f backend/db/ci/00_supabase_stub.sql
          python -m pip install -e "backend/pipeline[dev]"
          python -m pipeline.db.migrate
          python scripts/create_demo_users.py

      - name: Run API Unit & Integration Tests
        run: |
          cd backend/api
          npm ci
          npm test
          npm run build

      - name: Run Frontend Tests & Build
        run: |
          cd frontend
          npm ci
          npm test
          npm run build

      - name: Run Python Pipeline Tests & Reproducibility Check
        run: |
          pytest backend/pipeline/tests/test_datagen_smoke.py backend/pipeline/tests/test_data_dictionary.py
          python -m pipeline.datagen reproduce

  detection-benchmark:
    name: End-to-End Anomaly Detection Benchmark
    runs-on: ubuntu-latest
    needs: [db-migrations]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate, Load, and Evaluate Anomaly Detection
        run: |
          sudo apt-get install -y postgresql-client
          psql postgresql://postgres:postgrespassword@localhost:5432/postgres -f backend/db/ci/00_supabase_stub.sql
          python -m pip install -e "backend/pipeline[dev]"
          python -m pipeline.db.migrate --reset --yes
          python -m pipeline.datagen generate --scale small
          python -m pipeline.loader load --scale small
          python -m pipeline.detector run
          python -m pipeline.detector evaluate
