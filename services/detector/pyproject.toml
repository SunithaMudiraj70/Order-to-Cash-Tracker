[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "o2c-detector"
version = "0.1.0"
description = "Rule engine evaluating revenue leakage and process delays from source events"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "psycopg[binary]>=3.1.18",
    "pydantic>=2.7.1",
    "python-dotenv>=1.0.1",
    "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
    "black>=24.4.2",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
]

[project.scripts]
o2c-detector = "detector.evaluate.runner:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

